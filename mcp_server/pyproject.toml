[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jindrich Lechner", email = "lechnjin@cvut.cz" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp==1.28.1",
    "pydantic>=2.13.4",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
mcp-server = "mcp_server.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
